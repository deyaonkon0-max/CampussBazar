<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — CampusBazaar</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="admin-login.css">
</head>

<body>

  <header class="site">
    <div id="site-header"></div>
  </header>

  <main class="wrap">
    <div class="section-pad narrow-col">
      <div class="section-head">
        <h2>Admin / Author Login</h2>
        <p>For university admins and the platform author only — students use Sign Up instead.</p>
      </div>
      <form class="form-card" id="adminLoginForm" novalidate>
        <div class="field" id="f-email">
          <label>Email</label>
          <input type="email" id="loginEmail">
          <div class="field-error">Enter the email for your admin or author account.</div>
        </div>
        <div class="field" id="f-password">
          <label>Password</label>
          <input type="password" id="loginPassword">
          <div class="field-error">Incorrect password.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
        <div class="toast error" id="loginError">No account matches that email and password.</div>
      </form>
      <div class="card-white demo-box">
        <div style="font-weight:700;font-size:13px;margin-bottom:10px;">Demo accounts (this is a prototype — no real
          auth)</div>
        <div id="demoAccountList"></div>
      </div>
    </div>
  </main>
  <footer class="site">
    <div id="site-footer"></div>
  </footer>
  <script>window.CB_ACTIVE_PAGE = '';</script>
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="shared.js"></script>
  <script src="nav.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
