<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CampusBazaar</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="admin-dashboard.css">
</head>

<body>

  <header class="site">
    <div id="site-header"></div>
  </header>

  <main class="wrap">
    <div class="section-pad" id="gateWrap">
      <div class="empty-state">
        Checking your session… if you're not redirected, <a href="admin-login.html">log in here</a>.
      </div>
    </div>
    <div class="section-pad" id="dashWrap" style="display:none;">
      <div class="admin-header">
        <div>
          <div class="eyebrow" id="adminUniLabel"></div>
          <h2>Verifying students</h2>
          <p class="small-muted" id="adminNameLabel"></p>
        </div>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
      </div>
      <div id="newRequestBanner" class="toast warn" style="margin-bottom:20px;"></div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="pending">Pending <span id="pendingCountBadge"></span></button>
        <button class="tab-btn" data-tab="verified">Verified</button>
        <button class="tab-btn" data-tab="rejected">Rejected</button>
      </div>
      <div class="tab-panel active" id="tab-pending">
        <div id="pendingWrap"></div>
      </div>
      <div class="tab-panel" id="tab-verified">
        <div id="verifiedWrap"></div>
      </div>
      <div class="tab-panel" id="tab-rejected">
        <div id="rejectedWrap"></div>
      </div>
    </div>
  </main>
  <footer class="site">
    <div id="site-footer"></div>
  </footer>
  <script>window.CB_ACTIVE_PAGE = '';</script>
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="shared.js"></script>
  <script src="nav.js"></script>
  <script src="admin-dashboard.js"></script>
</body>
</html>
